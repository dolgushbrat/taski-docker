server {
  listen 80;

  location /api/ {
    # Заменил $http_host на $host
    proxy_set_header Host $host; 
    proxy_pass http://backend:8000/api/;
  }

  location /admin/ {
    # Заменил $http_host на $host
    proxy_set_header Host $host;
    proxy_pass http://backend:8000/admin/;
  }

  location / {
    alias /staticfiles/;
    index index.html;
  }
}